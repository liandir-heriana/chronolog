# ChronoLog local orchestration (TSK-012): backend app + isolated PostgreSQL.
# Env isolation: copy `.env.example` to `.env` (git-ignored) and adjust values.
# Compose v2 auto-loads `.env` from the project dir for ${...} interpolation,
# so no `env_file:` is needed and `docker compose config` also validates
# without a `.env` present (sane `:-` defaults below).
services:
  app:
    build: .
    container_name: chronolog-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronolog}
      POSTGRES_DB: ${POSTGRES_DB:-chronolog}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chronolog}:${POSTGRES_PASSWORD:-chronolog}@postgres:5432/${POSTGRES_DB:-chronolog}
      GRADIO_PORT: 7860
    # TSK-016: Gradio dashboard. Loopback-bound like postgres (local-dev only,
    # LAN-invisible, consistent with the TSK-015 F7 postgres decision) so
    # `curl localhost:7860` works without exposing the dev server to the LAN.
    ports:
      - "127.0.0.1:7860:7860"

  postgres:
    image: postgres:16
    container_name: chronolog-postgres
    restart: unless-stopped
    # Local-dev only: publish on loopback so the test suite reaches postgres
    # without PGHOST overrides. Loopback-bound, never exposed to the LAN.
    # Credentials stay in git-ignored .env; compose holds only ${VAR} refs.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronolog}
      POSTGRES_DB: ${POSTGRES_DB:-chronolog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronolog} -d ${POSTGRES_DB:-chronolog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: chronolog-pgdata
